[workspace]
authors = ["AndreaAmorosini <a.amorosini0020@gmail.com>"]
channels = ["conda-forge"]
name = "gori"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pip = ">=26.2.1,<27"
pymupdf = ">=1.28.0,<2"

[pypi-dependencies]
docling = { version = "==2.126.0", extras = ["rapidocr"] }
pydantic = ">=2.11, <3"
typer = ">=0.16, <1"
rich = ">=14, <15"
orjson = ">=3.10, <4"
python-dateutil = ">=2.9, <3"
tqdm = ">=4.67, <5"
pytest = ">=9.1.1, <10"
pytest-cov = ">=7.1.0, <8"
ruff = ">=0.16.7, <0.17"
