[project]
name = "media-kg-min"
version = "0.1.0"
description = "Setup minimale: KG unificato da rassegna stampa (LightRAG + unsloth)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
tqdm = ">=4.70.1,<5"
fastapi = ">=0.156.4,<0.157"
ollama = ">=0.32.15,<0.33"

[pypi-dependencies]
lightrag-hku = { version = ">=0.3", extras = ["api"] }
openai = ">=1.60"
sentence-transformers = ">=3.3"
networkx = ">=3.4"
pyvis = ">=0.3"
python-dotenv = ">=1.0"

[tasks]
ui = "lightrag-server --port 9621"
ingest = "python src/ingest.py"
graph = "python src/inspect_graph.py"
query = "python src/query.py"
