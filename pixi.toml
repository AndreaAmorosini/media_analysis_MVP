[workspace]
authors = ["AndreaAmorosini <a.amorosini0020@gmail.com>"]
channels = ["conda-forge"]
name = "gori"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pip = ">=26.2.1,<27"
pymupdf = ">=1.28.0,<2"
langchain = ">=1.4.6,<2"

[pypi-dependencies]
# docling-slim fornisce il pacchetto `docling` e la CLI. L'extra
# "standard" replica la catena del metapacchetto docling[rapidocr]
# (pypdfium2, docling-parse, docling-ibm-models, rapidocr) MA senza
# onnxruntime CPU: il backend onnxruntime è servito da onnxruntime-gpu
# (CUDAExecutionProvider), selezionabile via DOCLING_DEVICE senza
# modifiche in src/.
docling-slim = { version = "==2.126.0", extras = ["standard"] }
onnxruntime-gpu = "==1.31.0"
rapidocr = "==3.9.2"
pydantic = ">=2.11, <3"
typer = ">=0.16, <1"
rich = ">=14, <15"
orjson = ">=3.10, <4"
python-dateutil = ">=2.9, <3"
tqdm = ">=4.67, <5"
pytest = ">=9.1.1, <10"
pytest-cov = ">=7.1.0, <8"
ruff = ">=0.16.7, <0.17"
httpx = ">=0.27, <1"
trafilatura = ">=2.0, <3"
beautifulsoup4 = ">=4.12, <5"
