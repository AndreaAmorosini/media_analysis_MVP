[project]
name = "presskg-ingestion"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"

[pypi-dependencies]
presskg = { path = ".", editable = true }
neo4j = ">=6,<7"
openai = ">=1.70,<3"
pydantic = ">=2.9,<3"
python-dotenv = ">=1,<2"
tqdm = ">=4.66,<5"
json-repair = ">=0.60,<1"
sentence-transformers = ">=6.2.0, <7"

[tasks]
preflight = "python -m presskg.cli preflight"
init-db = "python -m presskg.cli init-db"
ingest = "python -m presskg.cli ingest"
stats = "python -m presskg.cli stats"
check = "python -m unittest discover -s tests -v"
enrich = "python -m presskg.enrich_graph"
normalize-predicates = "python -m presskg.normalize_predicates"

# Validation
validation-primary = "python -m presskg.validation primary"
validation-corrections = "python -m presskg.validation corrections"
validation-decisions = "python -m presskg.validation decisions"
validation-materialize = "python -m presskg.validation materialize"

# Full workflow, mantiene il comportamento precedente
validation-full = "bash scripts/run_validation_full.sh"