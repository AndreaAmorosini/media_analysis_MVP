[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "presskg"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "graph: audit di integrità del grafo su Neo4j reale, read-only; richiede il database attivo (altrimenti skip)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "docs/PressKG_AI_Handoff_2026-11-09",  # fotografia storica, non toccare
    "output",
]